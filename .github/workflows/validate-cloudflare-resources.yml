name: Validate Cloudflare Resources

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate-r2-storage:
    name: Validate R2 Storage
    runs-on: ubuntu-latest
    # ジョブレベルで secrets を環境変数にセット（if で secrets を直接使わない）
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Wrangler
        run: npm install -g wrangler
        
      - name: Check R2 bucket configuration
        run: |
          echo "Checking R2 bucket configuration from wrangler.toml..."
          if [ -f "wrangler.toml" ]; then
            cat wrangler.toml
          else
            echo "Warning: wrangler.toml not found"
          fi
          
      - name: Validate R2 bucket access
        # secrets ではなく env を使って条件判定
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          # List R2 buckets (if API token is available)
          wrangler r2 bucket list || echo "Could not list R2 buckets - check API token permissions"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          
  validate-kv-namespace:
    name: Validate KV Namespace
    runs-on: ubuntu-latest
    # 同じくジョブレベルで env をセット
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Wrangler
        run: npm install -g wrangler
        
      - name: Validate KV namespace access
        # secrets ではなく env を使って条件判定
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          # List KV namespaces (if API token is available)
          wrangler kv:namespace list || echo "Could not list KV namespaces - check API token permissions"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          
  validate-csv-data:
    name: Validate CSV Data Integrity
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Validate CSV files exist
        run: |
          set -euo pipefail
          echo "Checking CSV data files..."
          for locale in ja en ko; do
            file="data/akyo-data-${locale}.csv"
            if [ ! -f "${file}" ]; then
              echo "Error: ${file} not found"
              exit 1
            fi
            if [ ! -s "${file}" ]; then
              echo "Error: ${file} is empty"
              exit 1
            fi
          done

      # 行数ではなく CSV としてパースして数える（コメント欄に改行が入るため）。
      # 併せて ja/en/ko の ID 集合の一致・重複・書式も検査する。検出のみで修復はしない。
      - name: Validate catalog locale ID sets
        run: node scripts/catalog-locale-ids.js
          
  create-health-check-report:
    name: Create Health Check Report
    runs-on: ubuntu-latest
    needs: [validate-r2-storage, validate-kv-namespace, validate-csv-data]
    if: always()
    
    steps:
      - name: Create health report
        uses: actions/github-script@v7
        with:
          script: |
            const r2Status = '${{ needs.validate-r2-storage.result }}';
            const kvStatus = '${{ needs.validate-kv-namespace.result }}';
            const csvStatus = '${{ needs.validate-csv-data.result }}';
            
            const statusEmoji = (status) => status === 'success' ? '✅' : '❌';
            
            const report = `## 📊 Cloudflare Resources Health Check
            
            **Date**: ${new Date().toISOString()}
            
            ### Status Summary
            - ${statusEmoji(r2Status)} R2 Storage: ${r2Status}
            - ${statusEmoji(kvStatus)} KV Namespace: ${kvStatus}
            - ${statusEmoji(csvStatus)} CSV Data: ${csvStatus}
            
            ### Next Steps
            ${r2Status !== 'success' ? '- ⚠️ Check R2 bucket configuration and API token\n' : ''}
            ${kvStatus !== 'success' ? '- ⚠️ Check KV namespace configuration and API token\n' : ''}
            ${csvStatus !== 'success' ? '- ⚠️ Verify CSV data files in data/ directory\n' : ''}
            ${r2Status === 'success' && kvStatus === 'success' && csvStatus === 'success' ? '✅ All resources are healthy!\n' : ''}
            `;
            
            console.log(report);
