name: Verify Cloudflare Pages Rollback

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-rollback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-pages-rollback:
    name: Verify Cloudflare Pages rollback
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify rollback runtime
        run: |
          set -euo pipefail

          base_url="https://akyodex.pages.dev"
          max_attempts=6
          retry_seconds=5
          health_paths=(
            "/zukan"
            "/api/akyo-data?lang=ja"
          )

          for attempt in $(seq 1 "${max_attempts}"); do
            all_healthy=true

            for path in "${health_paths[@]}"; do
              status="$(curl --silent --show-error \
                --output /tmp/pages-rollback-body \
                --write-out "%{http_code}" \
                --connect-timeout 10 \
                --max-time 30 \
                "${base_url}${path}" || echo "000")"

              if [ "${status}" != "200" ]; then
                all_healthy=false
                echo "${base_url}${path} returned HTTP ${status}."
              fi
            done

            if [ "${all_healthy}" = "true" ]; then
              echo "Cloudflare Pages rollback runtime is healthy."
              exit 0
            fi

            if [ "${attempt}" -lt "${max_attempts}" ]; then
              echo "Rollback health check failed on attempt ${attempt}/${max_attempts}; retrying in ${retry_seconds}s."
              sleep "${retry_seconds}"
            fi
          done

          echo "::error::Cloudflare Pages rollback runtime is unavailable."
          exit 1
