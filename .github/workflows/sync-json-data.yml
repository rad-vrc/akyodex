name: Sync JSON Data from CSV

# =============================================================================
# CSV to JSON Sync Workflow
# =============================================================================
# This workflow automatically converts CSV data files to JSON format and
# uploads them to Cloudflare R2 for optimized data fetching (Phase 4).
#
# Required Secrets:
#   - R2_ACCESS_KEY_ID: Cloudflare R2 Access Key ID
#     (Create at: Cloudflare Dashboard → R2 → Manage R2 API Tokens)
#   - R2_SECRET_ACCESS_KEY: Cloudflare R2 Secret Access Key
#     (Displayed only once when creating the R2 API token)
#   - CLOUDFLARE_ACCOUNT_ID: Your Cloudflare Account ID
#     (Found in: Cloudflare Dashboard → R2 → Overview, or in the URL)
#   - REVALIDATE_SECRET: Secret token for on-demand ISR revalidation
#     (Generate a random string, e.g., `openssl rand -hex 32`)
#
# R2 Bucket Structure:
#   akyo-images/
#   ├── data/
#   │   ├── akyo-data-ja.json  (Japanese data)
#   │   ├── akyo-data-en.json  (English data)
#   │   └── akyo-data-ko.json  (Korean data)
#   └── images/
#       └── *.webp (avatar images)
#
# Public URL: https://images.akyodex.com/data/akyo-data-{lang}.json
# =============================================================================

on:
  push:
    branches:
      - main
    paths:
      - 'data/akyo-data-ja.csv'
      - 'data/akyo-data-en.csv'
      - 'data/akyo-data-ko.csv'
      - 'data/category-translations.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  R2_BUCKET: akyo-images
  R2_DATA_PATH: data
  JSON_FILE_JA: akyo-data-ja.json
  JSON_FILE_EN: akyo-data-en.json
  JSON_FILE_KO: akyo-data-ko.json
  SITE_URL: https://akyodex.com

jobs:
  sync-json:
    name: Convert CSV to JSON and Upload to R2
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # bot commitのpushはGITHUB_TOKENのためon:pushワークフローを起動しない
      # （GitHub仕様）。本番候補の作成をworkflow_dispatchで明示起動するために必要。
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Every attempt starts from current main, including manual reruns.
      - name: Regenerate and commit catalog data
        id: sync-data
        run: node scripts/sync-catalog-data.js

      - name: Upload JSON to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          echo "Validating required secrets..."
          MISSING_SECRETS=""
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            MISSING_SECRETS="${MISSING_SECRETS}R2_ACCESS_KEY_ID "
          fi
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            MISSING_SECRETS="${MISSING_SECRETS}R2_SECRET_ACCESS_KEY "
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            MISSING_SECRETS="${MISSING_SECRETS}CLOUDFLARE_ACCOUNT_ID "
          fi
          if [ -n "$MISSING_SECRETS" ]; then
            echo "::error::Missing required secrets: $MISSING_SECRETS"
            exit 1
          fi
          echo "✅ All required secrets are configured"

          R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          echo "Verifying R2 bucket access..."
          if ! aws s3 ls "s3://${{ env.R2_BUCKET }}/" --endpoint-url "$R2_ENDPOINT" > /dev/null 2>&1; then
            echo "::error::Cannot access R2 bucket '${{ env.R2_BUCKET }}'"
            exit 1
          fi
          echo "✅ R2 bucket is accessible"

          echo "Uploading JSON files to R2..."
          UPLOAD_FAILED=false
          MAX_RETRIES=3

          for LANG in JA EN KO; do
            JSON_VAR="JSON_FILE_${LANG}"
            JSON_FILE="${!JSON_VAR}"
            JSON_PATH="data/${JSON_FILE}"
            R2_PATH="s3://${R2_BUCKET}/${R2_DATA_PATH}/${JSON_FILE}"
            echo "Uploading $JSON_PATH to $R2_PATH..."

            RETRY=0
            SUCCESS=false
            while [ $RETRY -lt $MAX_RETRIES ]; do
              RETRY=$((RETRY + 1))
              if aws s3 cp "$JSON_PATH" "$R2_PATH" --endpoint-url "$R2_ENDPOINT" --content-type "application/json"; then
                echo "✅ Uploaded ${JSON_FILE} (attempt $RETRY/$MAX_RETRIES)"
                SUCCESS=true
                break
              fi
              echo "::warning::Upload failed for ${JSON_FILE} (attempt $RETRY/$MAX_RETRIES)"
              if [ $RETRY -lt $MAX_RETRIES ]; then
                DELAY=$((RETRY * 5))
                echo "Retrying in ${DELAY}s..."
                sleep $DELAY
              fi
            done
            if [ "$SUCCESS" = false ]; then
              echo "::error::Failed to upload ${JSON_FILE} after $MAX_RETRIES attempts"
              UPLOAD_FAILED=true
            fi
          done

          if [ "$UPLOAD_FAILED" = true ]; then
            echo "::error::One or more uploads failed"
            exit 1
          fi
          echo "🎉 R2 upload complete!"

      - name: Trigger ISR Revalidation and KV Cache Update
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          set -e
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "::warning::REVALIDATE_SECRET not configured, skipping ISR revalidation"
            exit 0
          fi
          echo "Triggering ISR revalidation..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ env.SITE_URL }}/api/revalidate" \
            -H "Content-Type: application/json" \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" \
            -d '{"paths": ["/", "/en", "/ko", "/zukan"], "tags": ["akyo-data", "akyo-data-ja", "akyo-data-en", "akyo-data-ko"], "updateKV": true}' \
            --max-time 60)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ ISR revalidation and KV cache update successful"
            echo "Response: $BODY"
          else
            echo "::warning::ISR revalidation failed (HTTP $HTTP_CODE)"
            echo "Response: $BODY"
          fi

      - name: Summary
        run: |
          echo "### Cache Invalidation (Phase 5a + 5b)" >> $GITHUB_STEP_SUMMARY
            echo "- ISR revalidation triggered for instant page updates" >> $GITHUB_STEP_SUMMARY
            echo "- Legacy and CatalogPayloadV1 KV caches updated for edge-side data access" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.sync-data.outputs.changed }}" == "true" ]; then
            echo "✅ JSON files updated and uploaded to R2" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Updated Files" >> $GITHUB_STEP_SUMMARY
            echo "- \`data/${{ env.JSON_FILE_JA }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`data/${{ env.JSON_FILE_EN }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`data/${{ env.JSON_FILE_KO }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### R2 URLs" >> $GITHUB_STEP_SUMMARY
            echo "- https://images.akyodex.com/${{ env.R2_DATA_PATH }}/${{ env.JSON_FILE_JA }}" >> $GITHUB_STEP_SUMMARY
            echo "- https://images.akyodex.com/${{ env.R2_DATA_PATH }}/${{ env.JSON_FILE_EN }}" >> $GITHUB_STEP_SUMMARY
            echo "- https://images.akyodex.com/${{ env.R2_DATA_PATH }}/${{ env.JSON_FILE_KO }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Cache Invalidation" >> $GITHUB_STEP_SUMMARY
            echo "- ISR revalidation triggered for instant updates" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes detected in JSON files" >> $GITHUB_STEP_SUMMARY
          fi

      # このワークフローがpushしたbot commit（JSON+フォントサブセット）は、
      # GITHUB_TOKENによるpushのため on:push の本番デプロイを起動しない
      # （GitHub仕様: GITHUB_TOKEN起点のイベントは新しいworkflow runを作らない）。
      # フォントのバイト列が変わった場合だけ、ガード付きの自動反映を要求する。
      # 本番との差分にアプリ変更が含まれる場合、production workflow側で停止する。
      - name: Trigger production font activation or candidate upload
        if: steps.sync-data.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FONT_CHANGED: ${{ steps.sync-data.outputs.fontChanged }}
        run: |
          set -e
          action=upload
          if [ "$FONT_CHANGED" = "true" ]; then
            action=activate-fonts
          fi
          gh workflow run deploy-cloudflare-workers-production.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f "action=$action"
          echo "Dispatched production action: $action"
          echo "- Production action: $action" >> "$GITHUB_STEP_SUMMARY"

      # 同上の理由で、bot commit では CI も起動しない。管理画面が書いた CSV の
      # コミットに対する CI は、JSON がまだ古い中間状態を見て
      # 「CSV と JSON のカテゴリが一致しない」で落ちる。同期後の木で回し直して、
      # 最終状態が検証済みだと分かるようにする。
      # CI の concurrency は ref 単位で cancel-in-progress なので、中間コミットの
      # 実行がまだ動いていればこちらに置き換わる
      # `if` にステータス判定関数が無いと暗黙の success() が付き、R2 アップロードや
      # ISR 再検証が落ちただけでここまでスキップされる。同期コミットは既に push 済みなので、
      # 配信が失敗しても検証されない木が残ってしまう。コードの検証は配信の成否から独立させる
      # （配信側の dispatch は据え置き。失敗した配信の続きを走らせる判断は別の話）
      - name: Trigger CI on the synced tree
        if: ${{ !cancelled() && steps.sync-data.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh workflow run ci.yml \
            --repo "${{ github.repository }}" \
            --ref main
          echo "Dispatched CI on the synced tree"
          echo "- CI: dispatched on the synced tree" >> "$GITHUB_STEP_SUMMARY"
