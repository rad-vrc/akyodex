name: Weekly Security Audit

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

concurrency:
  group: weekly-security-audit
  cancel-in-progress: false

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run npm audit
        if: github.event_name != 'pull_request'
        id: npm-audit
        run: |
          npm audit --audit-level=moderate --json > audit-results.json
        continue-on-error: true
        
      - name: Upload npm audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: audit-results.json
          retention-days: 30
          
      - name: Check Snyk configuration
        id: snyk-config
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Snyk Security Scan
        if: steps.snyk-config.outputs.configured == 'true'
        id: snyk-scan
        uses: snyk/actions/node@0.4.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          json: true

      - name: Upload Snyk results
        if: always() && steps.snyk-config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snyk-results
          path: snyk.json
          retention-days: 30
          
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          
      - name: Check for outdated dependencies
        if: github.event_name != 'pull_request'
        run: |
          echo "## Outdated Dependencies" > outdated.md
          npm outdated >> outdated.md || true
          cat outdated.md
          
      - name: Upload outdated dependencies report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: outdated-dependencies
          path: outdated.md
          retention-days: 30
          
      - name: Update security audit tracker
        if: github.event_name != 'pull_request' && always()
        uses: actions/github-script@v7
        env:
          SNYK_OUTCOME: ${{ steps.snyk-scan.outcome }}
          SNYK_CONFIGURED: ${{ steps.snyk-config.outputs.configured }}
        with:
          script: |
            await require('./scripts/security-audit-report.js')({ github, context, core });
